version: 2
updates:
  # GitHub Actions are SHA-pinned (with # vX.Y.Z comments); Dependabot keeps
  # the pins current. The "ci" prefix keeps PR titles valid for pr-title.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
